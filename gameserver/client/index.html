<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Den Quest — wire view</title>
<style>
    :root { color-scheme: dark; }
    body {
        margin: 0; background: #11181c; color: #cfe3e0;
        font: 14px/1.5 ui-monospace, "IBM Plex Mono", monospace;
        display: flex; flex-direction: column; align-items: center; gap: 10px;
        padding: 14px;
    }
    canvas { width: 100%; max-width: 960px; border-radius: 8px; background: #16222a; display: block; }
    .hud { display: flex; flex-wrap: wrap; gap: 6px 18px; max-width: 960px; width: 100%; }
    .hud b { color: #7fd3c4; font-weight: 600; }
    .hint { color: #7a8c8a; max-width: 960px; width: 100%; }
    kbd { background: #22323a; border: 1px solid #33474f; border-radius: 3px; padding: 1px 5px; }
</style>

<canvas id="c" width="960" height="320"></canvas>
<div class="hud">
    <span>you <b id="me">—</b></span>
    <span>tick <b id="tick">0</b></span>
    <span>enemy hp <b id="hp">—</b></span>
    <span>corrections <b id="corr">0</b></span>
    <span>down <b id="bps">0</b> B/s</span>
    <span>players <b id="n">0</b></span>
</div>
<div class="hint">
    <kbd>A</kbd>/<kbd>D</kbd> or <kbd>←</kbd>/<kbd>→</kbd> to move · <kbd>space</kbd> to swing.
    A top-down view of exactly what the wire carries — no models, no three.js. The real client is
    /marketplace/den-quest on the Wolf Den site; this is for watching the protocol.
</div>

<script>
// Surfaces a module that fails to parse or resolve. Without this a bad
// import is a silently blank page: the canvas is static HTML, so it renders
// either way and the only symptom is a HUD that never leaves its defaults.
addEventListener("error", (e) => {
    console.error("[client] error:", e.message || e.error, e.filename || "");
});
</script>
<script type="module">
console.log("[client] module start");
// ⚠️ ROOT-ABSOLUTE SPECIFIERS, NOT "./net.js". This page is served at BOTH
// "/" and "/client/index.html", and a relative specifier resolves against
// the DOCUMENT url -- so at "/" it asked for "/net.js", got a 404, and the
// whole module graph failed before the first statement ran. The symptom is
// a page that renders perfectly (the canvas and HUD are static markup) and
// simply never connects, with no error in the console, because an import
// that fails to resolve takes the console.log that would have told you
// with it.
import { createClient } from "/client/net.js";
import { EVENT, FLAG, PLAYER } from "/sim/protocol.js";
import { decodeEvent } from "/sim/codec.js";

// ─────────────────────────────────────────────────────────────────────────
// THE TEST PAGE. Rendering only -- every netcode decision lives in net.js,
// which the headless milestone test drives with no DOM at all.
//
// ⚠️ THE SWING ANIMATION PLAYS ON KEYDOWN, NOT ON THE SERVER'S REPLY. That
//    is the whole of "feels instant": the authoritative damage lands during
//    the windup, roughly 30-60 ms later, and nobody can tell. What is NOT
//    predicted is the consequence -- the number and the hp come from the
//    server, once, and this page only draws them.
// ─────────────────────────────────────────────────────────────────────────

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const el = (id) => document.getElementById(id);

const proto = location.protocol === "https:" ? "wss:" : "ws:";
const ws = new WebSocket(`${proto}//${location.host}/ws`);
ws.binaryType = "arraybuffer";

const client = createClient({ send: (d) => ws.readyState === 1 && ws.send(d), now: () => performance.now() });
// ⚠️ THE TICKET IS THE FIRST MESSAGE ON THE SOCKET, NEVER IN THE URL.
// Query strings land in access logs, proxy logs and browser history, and a
// 60-second credential in a log is still a credential. In the real client
// this comes from POST /api/marketplace/rt-ticket on the app's own origin;
// here it comes from the dev endpoint, which production cannot serve.
ws.addEventListener("open", async () => {
    console.log("[client] socket open");
    const r = await fetch("/dev/ticket", { method: "GET", cache: "no-store" }).catch(() => null);
    if (!r?.ok) { console.error("[client] no ticket available"); return; }
    const { ticket } = await r.json();
    ws.send(JSON.stringify({ type: "ticket", ticket }));
});
ws.addEventListener("error", () => console.error("[client] socket error"));
ws.addEventListener("close", (e) => console.warn("[client] socket close", e.code));
ws.addEventListener("message", (ev) => {
    const isBinary = ev.data instanceof ArrayBuffer;
    client.onMessage(isBinary ? new Uint8Array(ev.data) : ev.data, isBinary);
});

const keys = new Set();
addEventListener("keydown", (e) => {
    if ([" ", "ArrowLeft", "ArrowRight"].includes(e.key)) e.preventDefault();
    keys.add(e.key.toLowerCase());
});
addEventListener("keyup", (e) => keys.delete(e.key.toLowerCase()));

// Floating damage numbers, drawn from EVENTS and nothing else.
const floaters = [];
let lastEventCount = 0;

// The visible slice of the world. The zone is 2048 wide; show the part the
// fight happens in.
// The visible slice of the world, in metres, centred on the spawn.
const VIEW = { half: 42 };
let camX = 512;
let camY = 560;
const sx = (x) => ((x - camX) / (VIEW.half * 2)) * canvas.width + canvas.width / 2;
const sy = (y) => ((y - camY) / (VIEW.half * 2)) * canvas.height + canvas.height / 2;

let last = performance.now();
let bytesAt = 0;
let bytesThen = performance.now();

function frame(nowMs) {
    requestAnimationFrame(frame);
    const dtMs = Math.min(nowMs - last, 100);
    last = nowMs;

    client.sendInput({
        left: keys.has("a") || keys.has("arrowleft"),
        right: keys.has("d") || keys.has("arrowright"),
        forward: keys.has("w") || keys.has("arrowup"),
        back: keys.has("s") || keys.has("arrowdown"),
        attack: keys.has(" "),
        dtMs,
    });

    const evs = client.state.events;
    for (let i = lastEventCount; i < evs.length; i += 1) {
        const e = evs[i];
        if (e.event !== EVENT.HIT) continue;
        const at = client.renderPosition(e.targetId);
        floaters.push({ x: at ? at.x : 0, y: at ? at.y : 0, amount: e.amount, crit: e.crit, born: nowMs });
    }
    lastEventCount = evs.length;

    const me = client.state.predicted;
    camX = me.x; camY = me.y;

    ctx.fillStyle = "#16222a";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = "#1e2f38";
    for (let g = Math.floor(camX - VIEW.half); g <= camX + VIEW.half; g += 10) {
        ctx.beginPath(); ctx.moveTo(sx(g), 0); ctx.lineTo(sx(g), canvas.height); ctx.stroke();
    }
    for (let g = Math.floor(camY - VIEW.half); g <= camY + VIEW.half; g += 10) {
        ctx.beginPath(); ctx.moveTo(0, sy(g)); ctx.lineTo(canvas.width, sy(g)); ctx.stroke();
    }

    let players = 0;
    for (const [id, ent] of client.state.authoritative) {
        const pos = client.renderPosition(id);
        if (!pos) continue;
        const isEnemy = (ent.flags & FLAG.IS_ENEMY) !== 0;
        const isMe = id === client.state.playerId;
        const dead = (ent.flags & FLAG.DEAD) !== 0;
        if (!isEnemy) players += 1;
        if (dead) continue;

        const px = sx(pos.x);
        const py = sy(pos.y);
        const r = isEnemy ? 7 : 9;
        ctx.fillStyle = isEnemy ? "#8a4b4b" : (isMe ? "#7fd3c4" : "#5b8fa8");
        ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI * 2); ctx.fill();

        // Facing, as a spine out of the circle -- the thing a top-down view
        // is actually good for.
        const fa = ((pos.facing ?? ent.facing ?? 0) / 256) * Math.PI * 2;
        ctx.strokeStyle = "#cfe3e0";
        ctx.beginPath();
        ctx.moveTo(px, py);
        ctx.lineTo(px + Math.sin(fa) * r * 2, py - Math.cos(fa) * r * 2);
        ctx.stroke();

        ctx.fillStyle = "#7a8c8a";
        ctx.font = "11px ui-monospace, monospace";
        ctx.textAlign = "center";
        ctx.fillText(isEnemy ? String(ent.hp) : (isMe ? "you" : `#${id}`), px, py - r - 5);
    }

    for (let i = floaters.length - 1; i >= 0; i -= 1) {
        const f = floaters[i];
        const age = nowMs - f.born;
        if (age > 1100) { floaters.splice(i, 1); continue; }
        ctx.globalAlpha = Math.max(0, 1 - age / 1100);
        ctx.fillStyle = f.crit ? "#e6c88a" : "#e8a0a0";
        ctx.font = `${f.crit ? 19 : 15}px ui-monospace, monospace`;
        ctx.textAlign = "center";
        ctx.fillText(`-${f.amount}`, sx(f.x), sy(f.y) - 22 - age * 0.02);
        ctx.globalAlpha = 1;
    }

    // ── HUD ──────────────────────────────────────────────────────────
    el("me").textContent = client.state.playerId ?? "—";
    el("tick").textContent = client.state.serverTick;
    const enemy = client.state.authoritative.get(47);
    el("hp").textContent = enemy ? enemy.hp : "—";
    el("me").textContent = client.state.playerId ?? "—";
    el("corr").textContent = client.state.corrections;
    el("n").textContent = players;
    if (nowMs - bytesThen > 1000) {
        el("bps").textContent = Math.round((client.state.bytesIn - bytesAt) * 1000 / (nowMs - bytesThen));
        bytesAt = client.state.bytesIn;
        bytesThen = nowMs;
    }
}
requestAnimationFrame(frame);
</script>
