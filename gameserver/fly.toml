# ─────────────────────────────────────────────────────────────────────────
# DEN QUEST REALTIME SERVER — FLY CONFIG
#
# Decided 2026-11-09: Fly over Railway, and over Fargate. The reasons, from
# the decision record and the pricing that followed it:
#   - EGRESS. The doc budgets ~790 GB/mo at 100 sustained players. AWS bills
#     that at ~$0.09/GB plus an ALB; Fly is roughly a quarter of it, all in.
#   - ADDRESSABLE MACHINES. Zone sharding needs a given player routed to the
#     process holding that zone. Fly machines are individually addressable
#     (fly-replay, .internal DNS); behind an ALB you build service discovery
#     to get the same thing, which is the reason Vercel was rejected.
#   - SETUP. One interactive login and this file, versus a VPC.
# ─────────────────────────────────────────────────────────────────────────

app = "den-quest-rt"

# ⚠️ iad IS NOT A PREFERENCE. The database is on Neon's pooled endpoint in
# AWS us-east-1, and iad (Ashburn) is the same metro. The decision record is
# explicit that cross-region would be 80-150 ms and unusable, against 1-3 ms
# same-region. If this app is ever moved, the database moves with it.
primary_region = "iad"

[build]
    dockerfile = "Dockerfile"

[env]
    PORT = "8080"

[http_service]
    internal_port = 8080
    force_https = true

    # ⚠️ auto_stop IS OFF AND min_machines_running IS 1.
    # Scale-to-zero is the whole appeal of this platform and it is wrong
    # here. The machine holds world state in RAM by design -- stopping it
    # drops every connected player and loses the tick. A cold start is also
    # a visible stall in a game in a way it is not on a web page. The doc's
    # own cost model already assumes an always-on floor ("on a rented VM,
    # ten players and ten thousand packets a second cost the same as idle"),
    # so there is nothing to save here that was not already spent.
    auto_stop_machines = false
    auto_start_machines = true
    min_machines_running = 1

    # Connections, not requests: one player is one long-lived socket, and
    # counting requests would read a hundred players as almost no load.
    [http_service.concurrency]
        type = "connections"
        hard_limit = 400
        soft_limit = 300

    # Plain HTTP on the same port the sockets use -- see server.mjs. A
    # machine that fails this is restarted, which is correct, but it means
    # the health endpoint must not depend on anything that can be slow.
    [[http_service.checks]]
        interval = "15s"
        timeout = "3s"
        grace_period = "10s"
        method = "GET"
        path = "/health"

[[vm]]
    # The doc's own sizing: a few testers is 256 MB, 20 average / 100 peak is
    # 512 MB-1 GB. CPU is not the constraint at this scale -- 100 concurrent
    # is about 5% of one core. Start small; this line is cheap to change and
    # the right time to change it is against a number, not a guess.
    size = "shared-cpu-1x"
    memory = "512mb"
